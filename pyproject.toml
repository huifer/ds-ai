# ─────────────────────────────────────────────────────────────
# strata-ai · Python 包配置（PEP 621）
# ─────────────────────────────────────────────────────────────

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "strata-ai"
version = "0.1.1"
description = "The strata beneath AI — connect classical data structures with AI/ML algorithms."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = [
    "data-structures",
    "artificial-intelligence",
    "machine-learning",
    "deep-learning",
    "education",
    "computer-science",
]
authors = [
    { name = "Zen Huifer" },
]
maintainers = [
    { name = "Zen Huifer" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# ──────────────── 可选依赖组 ────────────────
dependencies = [
    "typing-extensions>=4.0; python_version<'3.10'",
]

[project.optional-dependencies]
# 数值 / 矩阵相关示例
numpy = ["numpy>=1.24"]
# 深度学习相关示例
torch = ["torch>=2.0"]
# 图相关示例
graph = ["networkx>=3.0"]
# 可视化
viz = ["matplotlib>=3.7"]
# 文档构建
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocs-awesome-pages-plugin>=2.9",
    "pymdown-extensions>=10.0",
]
# 开发工具
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
# 安装所有
all = [
    "strata-ai[numpy,torch,graph,viz,docs,dev]",
]

[project.urls]
Homepage = "https://github.com/huifer/strata-ai"
Repository = "https://github.com/huifer/strata-ai"
Issues = "https://github.com/huifer/strata-ai/issues"
Changelog = "https://github.com/huifer/strata-ai/blob/main/CHANGELOG.md"
Documentation = "https://huifer.github.io/strata-ai/"

# ──────────────── Hatchling 构建配置 ────────────────
[tool.hatch.build.targets.wheel]
packages = ["strata_ai"]
include = [
    "strata_ai/py.typed",
    "strata_ai/data/*.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "strata_ai/",
    "docs/",
    "examples/",
    "assets/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "mkdocs.yml",
]

[tool.hatch.version]
path = "strata_ai/__init__.py"

# ──────────────── 工具配置 ────────────────
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]  # line-length

[tool.mypy]
python_version = "3.9"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers"