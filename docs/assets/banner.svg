<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="strata-ai: The Strata Beneath AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="layer1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- 左侧：地层（strata）抽象视觉 -->
  <g opacity="0.95">
    <rect x="60"  y="70"  width="240" height="14" rx="2" fill="url(#layer1)"/>
    <rect x="60"  y="92"  width="220" height="10" rx="2" fill="url(#layer2)"/>
    <rect x="60"  y="108" width="240" height="14" rx="2" fill="url(#layer1)"/>
    <rect x="60"  y="130" width="200" height="10" rx="2" fill="url(#layer2)"/>
    <rect x="60"  y="146" width="240" height="14" rx="2" fill="url(#layer1)"/>
    <rect x="60"  y="168" width="220" height="10" rx="2" fill="url(#layer2)"/>
    <rect x="60"  y="184" width="240" height="14" rx="2" fill="url(#layer1)"/>
    <rect x="60"  y="206" width="180" height="10" rx="2" fill="url(#layer2)"/>
    <rect x="60"  y="222" width="240" height="14" rx="2" fill="url(#layer1)"/>
  </g>

  <!-- 左侧标签 -->
  <text x="60" y="55"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#64748b" letter-spacing="2">
    DATA STRUCTURES
  </text>

  <!-- 右侧：网络/AI 节点 -->
  <g opacity="0.9">
    <circle cx="1000" cy="100" r="5" fill="#22d3ee"/>
    <circle cx="1080" cy="130" r="5" fill="#a78bfa"/>
    <circle cx="970"  cy="160" r="5" fill="#22d3ee"/>
    <circle cx="1050" cy="190" r="5" fill="#a78bfa"/>
    <circle cx="1000" cy="220" r="5" fill="#22d3ee"/>
    <line x1="1000" y1="100" x2="1080" y2="130" stroke="#22d3ee" stroke-width="1" opacity="0.6"/>
    <line x1="1080" y1="130" x2="970"  y2="160" stroke="#a78bfa" stroke-width="1" opacity="0.6"/>
    <line x1="970"  y1="160" x2="1050" y2="190" stroke="#22d3ee" stroke-width="1" opacity="0.6"/>
    <line x1="1050" y1="190" x2="1000" y2="220" stroke="#a78bfa" stroke-width="1" opacity="0.6"/>
    <line x1="1000" y1="100" x2="970"  y2="160" stroke="#a78bfa" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- 右侧标签 -->
  <text x="1140" y="55" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#64748b" letter-spacing="2">
    AI / ML
  </text>

  <!-- 主标题 -->
  <text x="600" y="160" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="86" font-weight="800" fill="#f8fafc">strata-ai</text>

  <!-- 副标题 -->
  <text x="600" y="200" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="18" font-weight="500" fill="url(#accent)">
    The Strata Beneath AI
  </text>

  <!-- 描述 -->
  <text x="600" y="232" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="13" font-weight="400" fill="#94a3b8">
    Data Structures, Layered for AI · 数据结构 × 人工智能
  </text>
</svg>